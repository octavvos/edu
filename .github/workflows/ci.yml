name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # TZ 8-bo'lim: lint -> test -> security scan -> build image
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy apps config libs

  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: edu_test
          POSTGRES_USER: edu
          POSTGRES_PASSWORD: edu
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgres://edu:edu@localhost:5432/edu_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - name: Run tests (coverage >= 70% biznes-logika uchun, NF-06)
        run: pytest --cov=apps --cov-report=xml --cov-report=term-missing --cov-fail-under=70 -k "services or test_"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: bandit -r apps config libs -x '*/tests/*,*/migrations/*'
      - run: pip-audit -r requirements.txt || true  # audit natijasi hozircha bloklamaydi

  build-backend:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t edu-backend:${{ github.sha }} ./backend

  build-frontend:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  # staging-deploy / smoke-test / production-deploy: infratuzilma
  # (server/SSH kalitlari, registry) loyihaga ulanganda shu yerga qo'shiladi.
  # Deploy bosqichi har doim `manual approve` (GitHub Environment protection
  # rule) bilan himoyalanadi — TZ 8-bo'lim.
