services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edu}
      POSTGRES_USER: ${POSTGRES_USER:-edu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bir martalik: media bucket'ini yaratadi va ochiq o'qishga ruxsat beradi
  # (MINIO_BUCKET .env'da belgilangan nom bilan mos). Backend/Celery shu
  # bucket bo'lishiga tayanadi (STORAGES["default"] = S3Storage) — bucket
  # bo'lmasa fayl yuklash NoSuchBucket xatosi bilan buziladi.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-edu-platform}
    entrypoint: ["sh", "-c"]
    # command YAML ro'yxat (list) sifatida — bitta butun skript bitta arg
    # bo'lib "sh -c"ga uzatiladi; oddiy ko'p qatorli satr compose tomonidan
    # bo'shliqlar bo'yicha alohida arglarga bo'linib ketardi.
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb -p local/"$$MINIO_BUCKET" &&
        mc anonymous set download local/"$$MINIO_BUCKET"
    restart: "no"

  backend:
    build:
      context: ./backend
    image: edu-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
    volumes:
      - ./backend:/app
      - static_data:/app/staticfiles
      - media_data:/app/mediafiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    # 5.3-band: 2 replika talab qilinadi. `docker compose up` (swarm bo'lmagan
    # rejim) `deploy.replicas`ni e'tiborsiz qoldiradi — 2 nusxada ishga
    # tushirish uchun: `docker compose up --scale backend=2` (bunda "ports"
    # ni olib tashlab, nginx orqaligina ochish kerak bo'ladi).
    deploy:
      replicas: 2

  celery-worker:
    image: edu-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
    volumes:
      - ./backend:/app
      - media_data:/app/mediafiles
    depends_on:
      - backend
    command: celery -A config worker -l info -Q default,media --concurrency=4
    # Backend image'idagi HTTP healthcheck bu yerda mos emas (web-server yo'q)
    healthcheck:
      # CMD-SHELL kerak: exec shaklida $HOSTNAME kengaymaydi
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-beat:
    image: edu-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
    volumes:
      - ./backend:/app
    depends_on:
      - backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    # beat'ni tashqaridan "ping" qilib bo'lmaydi — meros qolgan HTTP tekshiruv o'chiriladi
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_data:
  media_data:
