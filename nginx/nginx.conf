worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 5120m;  # V-08: video yuklash uchun katta limit

    # 5.6: rate limit — anonim 60/min, auth uchun frontend/DRF darajasida qo'shimcha nazorat
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;

    upstream django_backend {
        server backend:8000;
    }

    upstream nextjs_frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # TZ 5.11: TLS 1.3 production'da bu blokdan tashqarida (masalan
        # Traefik yoki alohida 443 server bloki + Let's Encrypt) orqali
        # ta'minlanadi. Lokal/staging uchun http kifoya.

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        location /static/ {
            alias /var/www/static/;
            expires 30d;
            access_log off;
        }

        location /media/ {
            alias /var/www/media/;
            expires 7d;
            access_log off;
        }

        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /verify/ {
            proxy_pass http://django_backend;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://nextjs_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
